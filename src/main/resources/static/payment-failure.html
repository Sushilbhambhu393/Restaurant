<!DOCTYPE html>
<html>
<head>
    <title>Payment Failed</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #fbeaea;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 400px;
            margin: 80px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            padding: 40px 30px 30px 30px;
            text-align: center;
        }
        .icon {
            font-size: 60px;
            color: #ef4444;
            margin-bottom: 20px;
        }
        h1 {
            color: #ef4444;
            margin-bottom: 10px;
        }
        p {
            color: #2d3a4b;
            margin-bottom: 30px;
        }
        .btn {
            background: #4f8cff;
            color: #fff;
            border: none;
            padding: 10px 22px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            background: #2563eb;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="icon">&#10060;</div>
    <h1>Payment Failed</h1>
    <p>Unfortunately, your payment could not be processed.<br>Please try again or contact support.</p>
    <a class="btn" href="customer-menu.html">Back to Menu</a>
</div>
</body>
</html>
